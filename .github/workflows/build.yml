name: Build & Verify

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ThemeSwitcher/ThemeSwitcher.csproj -p:Platform=${{ matrix.platform }}

      - name: Build
        run: dotnet build ThemeSwitcher/ThemeSwitcher.csproj -c Release -p:Platform=${{ matrix.platform }} --no-restore

      - name: List build output
        shell: pwsh
        run: |
          Write-Host "=== Listing all files under ThemeSwitcher/bin ==="
          if (Test-Path "ThemeSwitcher/bin") {
            Get-ChildItem "ThemeSwitcher/bin" -Recurse -File | ForEach-Object {
              Write-Host $_.FullName.Replace("${{ github.workspace }}\", "")
            }
          } else {
            Write-Host "ThemeSwitcher/bin does not exist!"
            Write-Host "=== Listing project root ==="
            Get-ChildItem -Recurse -Directory | ForEach-Object {
              Write-Host $_.FullName.Replace("${{ github.workspace }}\", "")
            }
          }

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ThemeSwitcher-${{ matrix.platform }}
          path: ThemeSwitcher/bin/
          if-no-files-found: warn
