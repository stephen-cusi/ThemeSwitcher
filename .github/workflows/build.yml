name: Build & Verify

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ThemeSwitcher/ThemeSwitcher.csproj -p:Platform=${{ matrix.platform }}

      - name: Build
        run: dotnet build ThemeSwitcher/ThemeSwitcher.csproj -c Release -p:Platform=${{ matrix.platform }} --no-restore

      - name: Verify build output
        shell: pwsh
        run: |
          $outputDir = "ThemeSwitcher/bin/${{ matrix.platform }}/Release/net8.0-windows10.0.19041.0/${{ matrix.rid }}"
          if (Test-Path $outputDir) {
            Write-Host "✅ Build output: $outputDir"
            Get-ChildItem $outputDir -Filter "ThemeSwitcher.exe" | ForEach-Object { Write-Host "  → $($_.Name) ($([math]::Round($_.Length/1KB)) KB)" }
          } else {
            Write-Host "❌ Output not found at $outputDir"
            exit 1
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ThemeSwitcher-${{ matrix.platform }}
          path: ThemeSwitcher/bin/${{ matrix.platform }}/Release/net8.0-windows10.0.19041.0/${{ matrix.rid }}/
          if-no-files-found: error
