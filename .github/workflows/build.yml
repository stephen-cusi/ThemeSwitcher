name: Build & Verify

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, ARM64]
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore ThemeSwitcher/ThemeSwitcher.csproj -p:Platform=${{ matrix.platform }}

      - name: Build
        run: dotnet build ThemeSwitcher/ThemeSwitcher.csproj -c Release -p:Platform=${{ matrix.platform }} --no-restore

      - name: Verify build output
        shell: pwsh
        run: |
          $searchPaths = @(
            "ThemeSwitcher/bin/Release/net8.0-windows10.0.19041.0/${{ matrix.platform }}",
            "ThemeSwitcher/bin/Release/net8.0-windows10.0.19041.0/${{ matrix.rid }}",
            "ThemeSwitcher/bin/Release/net8.0-windows10.0.19041.0"
          )
          $found = $false
          foreach ($dir in $searchPaths) {
            if (Test-Path $dir) {
              $exes = Get-ChildItem $dir -Filter "*.exe" -Recurse
              if ($exes.Count -gt 0) {
                Write-Host "✅ Build output found at $dir"
                $exes | ForEach-Object { Write-Host "  → $($_.FullName)" }
                $found = $true
                break
              }
            }
          }
          if (-not $found) {
            Write-Host "⚠️ No .exe found. Listing all build output:"
            Get-ChildItem "ThemeSwitcher/bin" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  → $($_.FullName)" }
            Get-ChildItem "ThemeSwitcher/bin" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object { Write-Host "  → $($_.FullName)" }
            # Don't fail - allow upload to capture everything
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ThemeSwitcher-${{ matrix.platform }}
          path: |
            ThemeSwitcher/bin/Release/net8.0-windows10.0.19041.0/**/*
          if-no-files-found: warn
